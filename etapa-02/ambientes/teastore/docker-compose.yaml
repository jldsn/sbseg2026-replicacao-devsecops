# TeaStore 1.4.2 (examples/docker/docker-compose_default.yaml do commit 14648b7) com três
# mudanças para o Deploy Gate local: imagens fixadas por digest, portas publicadas só em
# 127.0.0.1 (o banco não é publicado) e um serviço ZAP em modo daemon na mesma rede.
# Uso: docker compose -f ambientes/teastore/docker-compose.yaml -p teastore up -d
name: teastore
services:
  registry:
    image: descartesresearch/teastore-registry@sha256:25000aa7fb7c1798febd464805d363a402cfe4a26877eb4d50874689efcc3e2f
    expose: ["8080"]
  db:
    image: descartesresearch/teastore-db@sha256:7a22000cc6b5fa7bfa99f7c8ccca68651ddd44684f5a571341723c839722b60c
    expose: ["3306"]
  persistence:
    image: descartesresearch/teastore-persistence@sha256:ac6b0fe9aeca04ee31fea20caed0b49af2ddf709c28a2cf1f4b9b041af05279b
    expose: ["8080"]
    environment: {HOST_NAME: persistence, REGISTRY_HOST: registry, DB_HOST: db, DB_PORT: "3306"}
  auth:
    image: descartesresearch/teastore-auth@sha256:1babe5ca10bda103daa03f52db3e2357e0d3ec32a9ed549c4b2e2020152b0dac
    expose: ["8080"]
    environment: {HOST_NAME: auth, REGISTRY_HOST: registry}
  image:
    image: descartesresearch/teastore-image@sha256:8f339e6b8ee7d7b2c3efd173b1a23c7ffda03ab9d0bc5b8904beb6a1f2e2bd98
    expose: ["8080"]
    environment: {HOST_NAME: image, REGISTRY_HOST: registry}
  recommender:
    image: descartesresearch/teastore-recommender@sha256:8cd0cc779929f9a03ac5990d09637f95e24bb333cbcc0b8df139c4c16df93d50
    expose: ["8080"]
    environment: {HOST_NAME: recommender, REGISTRY_HOST: registry}
  webui:
    image: descartesresearch/teastore-webui@sha256:d0e490bd025167fefaf84d43f978c3c6d14fad9bf3cba9bc49ef902a0d106078
    expose: ["8080"]
    environment: {HOST_NAME: webui, REGISTRY_HOST: registry}
    ports: ["127.0.0.1:18081:8080"]
  zap:
    image: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    command: >-
      zap.sh -daemon -host 0.0.0.0 -port 18090 -silent
      -config api.key=piloto-loopback
      -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
      -config autoupdate.checkOnStart=false
    ports: ["127.0.0.1:18090:18090"]
